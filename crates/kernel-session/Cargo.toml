[package]
name = "kernel-session"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "KERNEL authenticated encrypted sessions: the carrier handshake and sealed sessions carried over kernel-transport TCP"

[dependencies]
kernel-carrier = { path = "../kernel-carrier" }
kernel-transport = { path = "../kernel-transport" }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
