[package]
name = "kernel-carrier"
version = "0.0.0"
edition = "2021"
publish = false
description = "KERNEL carrier cell, Phases 0-2: handshake, sealed sessions, binary framing, TCP transport, cookie flood protection, rekeying, voice. UNVERIFIED until cargo test passes."

[dependencies]
# hmac is new in Phase 2 (flood.rs cookie challenge). The rest were already
# in the workspace Cargo.lock.
curve25519-dalek = { version = "4", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
getrandom = { version = "0.2", features = ["std"] }
hkdf = "0.12"
hmac = "0.12"
chacha20poly1305 = "0.10"
sha2 = "0.10"
zeroize = "1"
